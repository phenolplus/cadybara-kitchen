<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadybara</title>
    <link rel="stylesheet" href="./styles.css?v=dashboard-route1" />
  </head>
  <body>
    <header class="hero" aria-label="Cadybara AI CAD landing page">
      <nav class="top-bar" aria-label="Primary">
        <a class="brand-lockup" href="/lab/" aria-label="Cadybara home">
          <span class="brand-word">CADYBARA</span>
        </a>
        <div class="nav-actions">
          <button id="start-now" class="nav-action primary-action" type="button">Start now</button>
          <button id="register" class="nav-action" type="button">Register</button>
        </div>
      </nav>

      <main class="hero-center">
        <p>your favorite</p>
        <h1>cad capybaras</h1>
      </main>
    </header>

    <dialog id="auth-dialog" class="auth-dialog" aria-labelledby="auth-title">
      <form id="auth-form" class="auth-card" novalidate>
        <button id="auth-close" class="dialog-close" type="button" aria-label="Close">x</button>
        <p id="auth-kicker" class="auth-kicker">Start now</p>
        <h2 id="auth-title">Sign in</h2>

        <label class="field register-field">
          <span>Name</span>
          <input id="auth-name" name="name" autocomplete="name" />
        </label>

        <label class="field">
          <span>Email</span>
          <input id="auth-email" name="email" type="email" autocomplete="email" />
        </label>

        <label class="field">
          <span>Password</span>
          <input
            id="auth-password"
            name="password"
            type="password"
            autocomplete="current-password"
            minlength="8"
          />
        </label>

        <p id="auth-message" class="auth-message" role="status"></p>
        <button id="auth-submit" class="submit-action" type="submit">Sign in</button>
        <button id="auth-swap" class="swap-action" type="button">Need an account? Register</button>
      </form>
    </dialog>

    <script src="./landing.js?v=dashboard-route1"></script>
  </body>
</html>
