# Hosted gap-fill batch for 2026-06-12: 5 weakest prompt buckets x 3 reps.
#
# This targets prompt definitions with too few renderable/scored models after
# the planter, snowman, and hook batches. Run with `--provider-retries 0` so
# each planned cell spends at most one hosted API call.
experiment_id: "cadybara_online_gapfill_20260612_reps3"
output_path: "projects/cadybara-online-testing/workspace/runs/cadybara_online_gapfill_20260612_reps3/results.jsonl"
output_mode: "cadquery"
prompt_revision: "hosted_agent_gapfill_hook_snowman_v1"
artifact_root: "projects/cadybara-online-testing/workspace/runs/cadybara_online_gapfill_20260612_reps3/artifacts"
prompts_file: "../prompts/gapfill_hook_snowman_agent_prompts.yaml"
models:
  - name: "cadybara-agent-default"
    provider: "cadybara_api"
    base_url: "https://api.cadybara.com"
    timeout_seconds: 120
    family: "hosted-cadybara"
    role: "hosted-agent"
    response_mode: "sse"
    linear_deflection: 0.1
    angular_deflection: 0.1
strategies:
  - name: "identity"
sampling:
  temperatures: [0.0]
  repetitions: 3
  max_tokens: 1
  max_attempts_per_cell: 1
