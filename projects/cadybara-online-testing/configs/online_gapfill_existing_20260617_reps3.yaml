# Hosted existing-family gap-fill batch for 2026-06-17.
#
# This batch avoids starting a new prompt/object family. It targets the lowest
# remaining renderable STL buckets in the existing planter/snowman/hook data and
# uses the current Agent API export contract: SSE plus export_format: stl.
experiment_id: "cadybara_online_gapfill_existing_20260617_reps3"
output_path: "projects/cadybara-online-testing/workspace/runs/cadybara_online_gapfill_existing_20260617_reps3/results.jsonl"
output_mode: "cadquery"
prompt_revision: "hosted_agent_gapfill_existing_20260617_v1"
artifact_root: "projects/cadybara-online-testing/workspace/runs/cadybara_online_gapfill_existing_20260617_reps3/artifacts"
prompts_file: "../prompts/gapfill_existing_20260617_agent_prompts.yaml"
models:
  - name: "cadybara-agent-default"
    provider: "cadybara_api"
    base_url: "https://api.cadybara.com"
    timeout_seconds: 120
    family: "hosted-cadybara"
    role: "hosted-agent"
    response_mode: "sse"
    export_format: "stl"
    linear_deflection: 0.1
    angular_deflection: 0.1
strategies:
  - name: "identity"
sampling:
  temperatures: [0.0]
  repetitions: 3
  max_tokens: 1
  max_attempts_per_cell: 1
