# Official hosted smoke: 5 wall-planter prompts x 2 repetitions = 10 cells.
# Run with `--provider-retries 0` so hosted errors do not silently spend a
# second API call for the same cell.
experiment_id: "cadybara_online_smoke_reps2"
output_path: "projects/cadybara-online-testing/workspace/runs/cadybara_online_smoke_reps2_manual/results.jsonl"
output_mode: "cadquery"
prompt_revision: "hosted_agent_wall_planter_v1"
artifact_root: "projects/cadybara-online-testing/workspace/runs/cadybara_online_smoke_reps2_manual/artifacts"
prompts_file: "../prompts/wall_planter_agent_prompts.yaml"
models:
  - name: "cadybara-agent-default"
    provider: "cadybara_api"
    base_url: "https://api.cadybara.com"
    timeout_seconds: 75
    family: "hosted-cadybara"
    role: "hosted-agent"
    response_mode: "sse"
    linear_deflection: 0.1
    angular_deflection: 0.1
strategies:
  - name: "identity"
sampling:
  temperatures: [0.0]
  repetitions: 2
  max_tokens: 1
  max_attempts_per_cell: 1
