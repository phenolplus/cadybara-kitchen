[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadybara-kitchen"
version = "0.1.0"
description = "CLI research harness for benchmarking local Ollama prompt sensitivity."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    # CadQuery turns model-written CAD instructions into STL/STEP review artifacts.
    "cadquery>=2.7",
    "httpx>=0.27",
    "pydantic>=2",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "respx>=0.21",
]
cad-diffusion = [
    "torch>=2.2",
]

[project.scripts]
cadybara = "cadybara.cli:app"

[tool.hatch.build.targets.wheel]
packages = [
    "projects/local-running/cadybara",
    "projects/cad-diffusion/cadybara_cad_diffusion",
    "projects/cadybara-online-testing/cadybara_online_testing",
]

[tool.pytest.ini_options]
pythonpath = [
    "projects/local-running",
    "projects/cad-diffusion",
    "projects/cadybara-online-testing",
]
testpaths = [
    "projects/local-running/tests",
    "projects/cad-diffusion/tests",
    "projects/cadybara-online-testing/tests",
]
